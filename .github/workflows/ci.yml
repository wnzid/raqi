name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: footwear, POSTGRES_USER: footwear, POSTGRES_PASSWORD: footwear_ci }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U footwear" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      NODE_ENV: test
      WEB_URL: http://localhost:3000
      API_URL: http://localhost:4000/api
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      DATABASE_URL: postgresql://footwear:footwear_ci@localhost:5432/footwear?schema=public
      REDIS_URL: redis://localhost:6379
      BETTER_AUTH_SECRET: ci-only-secret-at-least-32-characters-long
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10.15.1 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @footwear/database exec prisma migrate deploy
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
